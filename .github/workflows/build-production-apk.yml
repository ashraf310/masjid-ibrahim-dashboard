name: Build production Android TV APK
on:
  push:
    branches: [main]
    paths:
      - 'android-production/**'
      - '.github/workflows/build-production-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build production APK
        working-directory: android-production
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: masjid-ibrahim-production-tv-v1.0
          path: android-production/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
