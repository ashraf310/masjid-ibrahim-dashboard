name: Build staging Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [development/multiscreen-presenter-v1]
    paths:
      - 'android-staging/**'
      - '.github/workflows/android-staging-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable staging debug APK
        working-directory: android-staging
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: masjid-ibrahim-tv-staging-apk
          path: android-staging/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
