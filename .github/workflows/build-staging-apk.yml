name: Build staging Android TV APK
on:
  push:
    branches:
      - development/multiscreen-presenter-v1
    paths:
      - 'android-staging/**'
      - '.github/workflows/build-staging-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build staging debug APK
        working-directory: android-staging
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable staging APK
        uses: actions/upload-artifact@v4
        with:
          name: masjid-ibrahim-staging-tv-v0.6-auto-launch
          path: android-staging/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
